name: Run Tests

on:
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run python -m pytest
        env:
          DATABASE_URL: sqlite:///./test.db
          SECRET_KEY: "ci-test-secret-key-at-least-32-characters-long"
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          JWT_ALGORITHM: "HS256"
